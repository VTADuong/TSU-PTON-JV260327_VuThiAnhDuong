spring.application.name=phone-store
server.port=8080

# ===== MySQL Workbench: sửa username/password cho đúng máy của bạn =====
spring.datasource.url=jdbc:mysql://localhost:3306/phone_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=Asia/Ho_Chi_Minh


# Cấu hình upload file
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB